paths:
  metadata_csv: data/mock/metadata.csv
  diagnoses_csv: data/mock/diagnoses.csv
  icd_phecode_map: data/mappings/Phecode_map12_filtered.csv
  phecode_task_map: data/mappings/refined_mapped_phecodes.csv
  out_dir: out/
  labs_csv: null             # path to labs CSV (patient_id, date, loinc_code, value)
  labs_metadata: data/mappings/lab_types_analysis.pkl
  loinc_map: data/mappings/lab_loinc_map.csv
  labs_checkpoint: data/mappings
  sae_cache_dir: data/sae        # SAE encoder weights auto-downloaded from HuggingFace on first use
  vertex_project: null           # GCP project ID (e.g. som-nero-phi-sgatidis-ge-ai)
  vertex_location: us-central1
  vertex_model: gemini-2.5-pro

steps: [embeddings, outcomes, sae, autorate]  # override e.g. steps=[embeddings]

llm: ollama               # AutoRate LLM backend: "ollama" (local, default) or "vertex"
ollama_model: gemma4:31b
ollama_host: http://localhost:11434
ollama_auto_start: true  # auto-start `ollama serve` + `ollama pull` on first use if not already running
                          # (requires the `ollama` binary itself to already be installed: https://ollama.com/download)

huggingface_token: null   # set your HuggingFace token here

batch_size: 8

trainer:
  accelerator: auto
  devices: 1

# Prevent Hydra from changing the working directory
hydra:
  run:
    dir: .
